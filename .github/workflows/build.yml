name: Build

# PRs and pushes build the installers and upload them as artifacts.
# Releasing: Actions → Build → Run workflow on main, pick the version bump. The builds use the
# bumped version, and only when both pass is the bump committed, tagged and the Release published.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (none releases the current package.json version)
        type: choice
        options: [patch, minor, major, none]
        default: patch

env:
  BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'none' }}

# A newer push to the same PR or to dev cancels the run still going for the older commit. Release
# runs each get their own group and are never cancelled: stopping one halfway could leave the bump
# committed without its release.
concurrency:
  group: build-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: the native helper needs the build's glibc (2.35 runs on Debian 12 too)
          - os: ubuntu-22.04
            dist: linux
          - os: windows-latest
            dist: win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Only release from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "::error::Releases run from main (merge dev into main first)"
          exit 1

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # Same bump the release job commits, so the installers carry the new version
      - name: Bump version
        if: env.BUMP != 'none'
        run: npm version ${{ env.BUMP }} --no-git-tag-version

      # rpm tools, and what the Linux helper's own FFmpeg and bundled Mesa drivers are built with
      # (scripts/deps). Those builds are cached by their scripts: on a miss stage-native.js runs them
      - name: Install rpm tools and the native helper's build dependencies
        if: matrix.dist == 'linux'
        run: |
          sudo apt-get remove -y libunwind-14-dev   # the image's; it conflicts with packages below
          sudo apt-get install -y rpm
          bash scripts/deps/ubuntu-packages.sh
          echo "SHARKORD_REQUIRE_NATIVE=1" >> "$GITHUB_ENV"
      # The helper's own FFmpeg (and on Linux the Mesa drivers), cached by the scripts that build them
      - name: Cache the native helper's dependencies
        uses: actions/cache@v4
        with:
          path: build/deps
          key: native-deps-${{ runner.os }}-${{ hashFiles('scripts/deps/**') }}

      # The native screen share helper (native/) links our own FFmpeg, built with MSVC from the
      # image's MSYS2 shell (scripts/deps/ffmpeg-windows.sh, run by stage-native.js on a cache
      # miss); bindgen uses the image's LLVM. Rust comes from native/rust-toolchain.toml.
      - name: Install the native helper's build tools
        if: matrix.dist == 'win'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\bash.exe -lc 'pacman -S --noconfirm --needed make diffutils git pkgconf'
          choco install pkgconfiglite -y --no-progress
          "SHARKORD_REQUIRE_NATIVE=1" >> $env:GITHUB_ENV

      - run: npm ci
      - run: npm run dist:${{ matrix.dist }}
      # The installed clients update from these; a release without them is one nobody updates to
      - name: Check the update feed files
        shell: bash
        run: |
          ls release/*.yml | grep -v builder-debug.yml || { echo "::error::no update manifest (latest*.yml) in release/"; exit 1; }
          [ "${{ matrix.dist }}" != win ] || ls release/*.blockmap || { echo "::error::no blockmap for the Windows installer"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: sharkord-${{ matrix.dist }}
          if-no-files-found: error
          # latest*.yml and the blockmaps are the installed clients' update feed (electron-updater)
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.exe
            release/*.yml
            !release/builder-debug.yml
            release/*.blockmap

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Commit version and tag
        id: tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          [ "$BUMP" = none ] || npm version "$BUMP" --no-git-tag-version
          tag=v$(node -p "require('./package.json').version")
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then echo "::error::$tag already exists"; exit 1; fi
          git diff --quiet || git commit -qam "Release $tag"
          git tag "$tag"
          git push --atomic origin HEAD:main "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG
          file() { basename "$(ls dist/*"$1" | head -n1)"; }
          exe=$(file .exe) appimage=$(file .AppImage) deb=$(file .deb) rpm=$(file .rpm)
          {
            echo '## Downloads'
            echo
            echo '| Platform | File | Install |'
            echo '| --- | --- | --- |'
            echo "| Windows 10/11 | [$exe]($url/$exe) | Run the installer. It isn't code-signed, so SmartScreen may warn: **More info → Run anyway** |"
            echo "| Linux (any distro) | [$appimage]($url/$appimage) | \`chmod +x $appimage\` and run it |"
            echo "| Debian / Ubuntu | [$deb]($url/$deb) | \`sudo apt install ./$deb\` |"
            echo "| Fedora / openSUSE | [$rpm]($url/$rpm) | \`sudo dnf install ./$rpm\` |"
            echo
            echo '## Changes'
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --invert-grep --grep='^Release v' --pretty='- %s' "$prev..$TAG"
              echo
              echo "**Full diff**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$prev...$TAG"
            else
              git log --no-merges --invert-grep --grep='^Release v' --pretty='- %s' "$TAG"
            fi
          } > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Sharkord ${{ steps.tag.outputs.tag }}
          body_path: notes.md
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          files: dist/*

      # Keep dev on top of the release commit so the next dev → main merge fast-forwards
      - name: Bring the release commit into dev
        run: |
          git fetch origin dev
          git checkout -q -B dev origin/dev
          git merge --no-edit main
          git push origin dev
