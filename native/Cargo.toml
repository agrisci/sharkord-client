[package]
name = "sharkord-share"
version = "0.1.0"
edition = "2024"
publish = false
description = "Native screen capture + hardware encode for the Electron client's screen share"

[dependencies]
anyhow = "1"
serde_json = "1"
# Capture filters and hardware encoders, linked statically from our own FFmpeg
# (scripts/deps/ffmpeg.sh on Linux, scripts/deps/ffmpeg-windows.sh on Windows)
ffmpeg-sys-next = { version = "9", default-features = false, features = ["avcodec", "avfilter", "static"] }

# Windows: which adapter and output drive the picked monitor (DXGI, display configuration)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Devices_Display", "Win32_Graphics_Gdi"] }

# Linux: the xdg-desktop-portal ScreenCast session (zbus is pure Rust; no tokio), its PipeWire
# stream, and Vulkan for the DMA-BUF modifiers and fences
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["screencast", "async-io"] }
pipewire = { version = "0.10", features = ["v0_3_33"] }
ash = { version = "0.38", default-features = false, features = ["std"] }

[profile.release]
debug = "line-tables-only"
